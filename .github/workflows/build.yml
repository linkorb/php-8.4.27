name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  apache-bookworm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/linkorb/php-8.4.27:8.4.27-apache-bookworm
          labels: |
            org.opencontainers.image.source=https://github.com/linkorb/php-8.4.27
            org.opencontainers.image.description=Temporary build of upstream php:8.4.27-apache-bookworm
            org.opencontainers.image.revision=${{ github.sha }}
